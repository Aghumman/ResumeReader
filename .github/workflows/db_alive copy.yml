name: Keep Database Alive

on:
  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  # Allows you to trigger it manually from the Actions tab anytime
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary python-dotenv

      - name: Run ping script
        env:
          DATABASE_URI: ${{ secrets.DB_URI }}
        run: |
          python -c "
          import os
          import psycopg2
          from urllib.parse import unquote

          db_uri = os.getenv('DATABASE_URI')
          if not db_uri:
              print('❌ Error: DATABASE_URI secret is missing!')
              exit(1)

          try:
              # Clean off the protocol scheme
              clean_uri = db_uri.replace('postgresql://', '').replace('postgres://', '')
              
              # Split user:pass from host:port/dbname safely from the right
              user_pass, rest = clean_uri.rsplit('@', 1)
              user, password = user_pass.split(':', 1)
              
              # Decode the password back to its original characters
              password = unquote(password)
              
              # Split host:port from dbname
              host_port, dbname = rest.rsplit('/', 1)
              host, port = host_port.split(':', 1)
              
              conn = psycopg2.connect(
                  dbname=dbname,
                  user=user,
                  password=password,
                  host=host,
                  port=int(port)
              )
              
              cursor = conn.cursor()
              cursor.execute('SELECT 1;')
              result = cursor.fetchone()
              cursor.close()
              conn.close()
              print('✅ Success! Database pinged successfully:', result)
          except Exception as e:
              print('❌ Failed to connect to database:', e)
              exit(1)
          "